name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Android Kotlin unit tests
        run: gradle -p android testDebugUnitTest --stacktrace

      - name: Prepare release signing keystore
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/apartmentfinder-release.jks"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            printf '%s' "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > "$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias apartmentfinder \
              -storepass apartmentfinder \
              -keypass apartmentfinder \
              -dname "CN=ApartmentFinder, OU=Mobile, O=Galaxybigbird, L=Las Vegas, ST=NV, C=US"
            echo "ANDROID_KEYSTORE_PASSWORD=apartmentfinder" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=apartmentfinder" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=apartmentfinder" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle -p android assembleRelease --stacktrace

      - name: Verify APK signature and package release asset
        run: |
          set -euo pipefail
          APK_IN="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_IN"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK_IN"
          mkdir -p dist-android
          cp "$APK_IN" "dist-android/ApartmentFinder-Android-0.1.0-34.1.apk"
          sha256sum "dist-android/ApartmentFinder-Android-0.1.0-34.1.apk" > "dist-android/ApartmentFinder-Android-0.1.0-34.1.apk.sha256"
          ls -lh dist-android/

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApartmentFinder-Android-APK
          path: dist-android/*
          if-no-files-found: error

      - name: Publish downloadable APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v0.1.0-34.1"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          cat <<'EOF' > "$NOTES_FILE"
          Native Android build of ApartmentFinder (0.1.0 · parity with iOS Build 34.1).

          ### Highlights
          - Fixes wall-frontage ESE pin matching across 278 communities (including **SYNC Apartment Homes**, Zerzura, Diamond Sands, Fora, Summit on Boulder) when OnTrac omits street directionals (`7089 Aliante Pkwy` vs `7089 North Aliante Parkway`).
          - Automatically derives community map coordinates from mapped pin centroids for all 827 communities missing catalog lat/lon (eliminates "Community location not mapped" & "Apartment location missing").
          - Auto-syncs the live Las Vegas Valley **Wave 36+** catalog (**2,463 communities · 355,222 precision pins across 65 ZIPs**).

          ### Install on Android
          1. Tap **ApartmentFinder-Android-0.1.0-34.1.apk** below to download on your phone.
          2. Open the downloaded file and tap **Install** (allow *Install unknown apps* if prompted).
          3. Launch ApartmentFinder — it automatically downloads and indexes the live Wave 36+ Las Vegas Valley pin catalog on first run.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist-android/ApartmentFinder-Android-0.1.0-34.1.apk" \
              "dist-android/ApartmentFinder-Android-0.1.0-34.1.apk.sha256" \
              --clobber
            gh release edit "$TAG" --title "ApartmentFinder Android 0.1.0 (Build 34.1)" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              "dist-android/ApartmentFinder-Android-0.1.0-34.1.apk" \
              "dist-android/ApartmentFinder-Android-0.1.0-34.1.apk.sha256" \
              --title "ApartmentFinder Android 0.1.0 (Build 34.1)" \
              --notes-file "$NOTES_FILE"
          fi
